        <script>
            // DOM Elements
            const fileUpload = document.getElementById('file-upload');
            const fileNameDisplay = document.getElementById('file-name');
            const uploadPrompt = document.getElementById('upload-prompt');
            const textInput = document.getElementById('text-input');
            const analyzeButton = document.getElementById('analyze-button');
            const buttonText = document.getElementById('button-text');
            const loadingSpinner = document.getElementById('loading-spinner');
            const placeholder = document.getElementById('placeholder');
            const resultsTabs = document.getElementById('results-tabs');
            const tabAnalysis = document.getElementById('tab-analysis');
            const contentAnalysis = document.getElementById('content-analysis');
            const fileInfo = document.getElementById('file-info');
            const deleteFileButton = document.getElementById('delete-file-button'); // Keep declaration

            // State
            let currentAnalysisData = null;

            // --- Event Listeners ---
            // Wrap in DOMContentLoaded to ensure elements exist
            document.addEventListener('DOMContentLoaded', () => {
                // Check if elements exist before adding listeners
                if (fileUpload) fileUpload.addEventListener('change', handleFileUpload);
                if (deleteFileButton) deleteFileButton.addEventListener('click', handleDeleteFile); // Error was here
                if (analyzeButton) analyzeButton.addEventListener('click', handleAnalysis);
                // No need for tab listener as there's only one tab
            });

            // --- Input Handlers ---
            function handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const allowedTypes = ['application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/pdf', 'text/plain'];
                if (!allowedTypes.includes(file.type)) {
                    alert('Loại tệp không được hỗ trợ. Vui lòng chọn DOCX, PDF, hoặc TXT.');
                    resetFileInput();
                    return;
                }
                const maxSize = 5 * 1024 * 1024;
                if (file.size > maxSize) {
                    alert(`Tệp quá lớn (tối đa ${maxSize / 1024 / 1024}MB).`);
                    resetFileInput();
                    return;
                }
                fileNameDisplay.textContent = file.name;
                fileInfo.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
                const reader = new FileReader();
                reader.onload = (event) => {
                    if (file.type === 'text/plain') {
                        textInput.value = event.target.result;
                    } else {
                        textInput.value = `--- Nội dung tệp ${file.name} ---\n(Chức năng đọc nội dung PDF/DOCX cần xử lý phía máy chủ hoặc dùng thư viện chuyên dụng.\nHãy dán nội dung vào ô bên trên để phân tích.)`;
                    }
                };
                reader.onerror = () => {
                    alert('Không thể đọc tệp tin.');
                    resetFileInput();
                };
                if (file.type === 'text/plain') {
                    reader.readAsText(file);
                } else {
                    reader.onload({ target: { result: '' } });
                }
            }
            function resetFileInput() {
                fileUpload.value = '';
                textInput.value = '';
                fileInfo.classList.add('hidden');
                fileNameDisplay.textContent = '';
                uploadPrompt.classList.remove('hidden');
            }
            function handleDeleteFile(e) {
                e.preventDefault();
                e.stopPropagation();
                resetFileInput();
            }

            // --- Analysis Logic ---
            async function handleAnalysis() {
                const textToAnalyze = textInput.value.trim();
                if (!textToAnalyze || textToAnalyze.startsWith('--- Nội dung tệp')) {
                    alert('Vui lòng nhập hoặc dán nội dung văn bản hợp lệ.');
                    return;
                }
                setLoadingState(true);

                // --- CACHE LOGIC REMOVED ---

                const analysisResult = await performMainAnalysis(textToAnalyze);
                if (analysisResult) {
                    currentAnalysisData = analysisResult;
                    // --- CACHE SAVE REMOVED ---
                    displayAnalysis(currentAnalysisData);
                    showResults();
                }
                setLoadingState(false);
            }
            function showResults() {
                placeholder.classList.add('hidden');
                resultsTabs.classList.remove('hidden');
                tabAnalysis.classList.add('active');
                contentAnalysis.classList.remove('hidden');
            }

            // --- UI Updates ---
            function setLoadingState(isLoading) {
                analyzeButton.disabled = isLoading;
                loadingSpinner.classList.toggle('hidden', !isLoading);
                analyzeButton.querySelector('#analyze-icon').classList.toggle('hidden', isLoading);
                buttonText.textContent = isLoading ? 'Đang phân tích...' : 'Phân tích Văn bản';
            }

            // --- API & Analysis Functions ---
            async function makeApiCall(systemPrompt, userText, schema, maxRetries = 2) {
                const apiKey = 'AIzaSyCkpk0BdN-S23WXb5_nqv1hryalaHvEaNs';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: userText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: 'application/json', responseSchema: schema },
                };
                for (let attempt = 0; attempt <= maxRetries; attempt++) {
                    try {
                        console.log(`API Call Attempt ${attempt + 1}`);
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });
                        if (!response.ok) {
                            const errorBody = await response.text();
                            console.error(`API Error ${response.status}: ${errorBody}`);
                            throw new Error(`API call failed: ${response.status}`);
                        }
                        const result = await response.json();
                        console.log('API Response:', result);
                        const candidate = result.candidates?.[0];
                        if (!candidate) {
                            const blockReason = result.promptFeedback?.blockReason;
                            const errorMsg = blockReason ? `Yêu cầu bị chặn: ${blockReason}.` : 'Phản hồi không hợp lệ từ AI.';
                            console.error(blockReason ? `API blocked: ${blockReason}` : 'API response missing candidates.');
                            alert(errorMsg);
                            return null;
                        }
                        if (candidate.finishReason && candidate.finishReason !== 'STOP') {
                            console.error(`API finished with reason: ${candidate.finishReason}`);
                            let alertMsg = `AI không hoàn thành yêu cầu (Lý do: ${candidate.finishReason}).`;
                            switch (candidate.finishReason) {
                                case 'SAFETY':
                                    alertMsg = 'Yêu cầu bị chặn do cài đặt an toàn. Vui lòng thử lại với nội dung khác.';
                                    break;
                                case 'RECITATION':
                                    alertMsg = 'Phản hồi bị chặn do trích dẫn quá nhiều. Vui lòng điều chỉnh yêu cầu.';
                                    break;
                                case 'MAX_TOKENS':
                                    alertMsg = 'Phản hồi quá dài và bị cắt ngắn. Hãy thử với văn bản ngắn hơn.';
                                    break;
                            }
                            alert(alertMsg);
                            return null;
                        }
                        const textPart = candidate.content?.parts?.[0]?.text;
                        if (textPart) {
                            try {
                                return JSON.parse(textPart);
                            } catch (parseError) {
                                console.error('Failed to parse JSON:', parseError, textPart);
                                alert('Lỗi phân tích phản hồi JSON từ AI.');
                                return null;
                            }
                        } else {
                            console.warn('API response missing text part.', result);
                            alert('AI không trả về nội dung hợp lệ.');
                            return null;
                        }
                    } catch (error) {
                        console.error(`API call attempt ${attempt + 1}/${maxRetries + 1} failed:`, error);
                        if (attempt === maxRetries) {
                            alert(`Lỗi kết nối đến AI sau ${maxRetries + 1} lần thử. Vui lòng kiểm tra lại kết nối hoặc thử lại sau.`);
                            return null;
                        }
                        const waitTime = Math.min(1000 * Math.pow(2, attempt), 5000);
                        console.log(`Retrying in ${waitTime}ms...`);
                        await new Promise((resolve) => setTimeout(resolve, waitTime));
                    }
                }
                return null;
            }
            async function performMainAnalysis(text) {
                const systemPrompt = `Bạn là một chuyên gia phân tích văn học Việt Nam. Phân tích văn bản được cung cấp và trả về một đối tượng JSON theo schema. Nội dung phải bằng tiếng Việt, chi tiết, sâu sắc, và phù hợp với ngữ cảnh văn học Việt Nam.

### QUY TẮC PHÂN LOẠI THỂ LOẠI ###

            // === Text to Image Conversion (unchanged) ===
            async function textToImage(text, width = 800, options = {}) {
                const {
                    fontSize = 16,
                    fontFamily = 'Inter, sans-serif',
                    lineHeight = 1.7,
                    padding = 30,
                    backgroundColor = '#ffffff',
                    textColor = '#334155',
                    maxWidth = width - padding * 2,
                } = options;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const parseInlineFormatting = (line) => {
                    const segments = [];
                    let remainingText = line;
                    let match;
                    const regex = /(\*|_)(.*?)\1/g;
                    let lastIndex = 0;
                    while ((match = regex.exec(remainingText)) !== null) {
                        if (match.index > lastIndex) {
                            segments.push({ text: remainingText.substring(lastIndex, match.index), style: {} });
                        }
                        const style = {};
                        if (match[1] === '*') style.bold = true;
                        if (match[1] === '_') style.italic = true;
                        segments.push({ text: match[2], style: style });
                        lastIndex = regex.lastIndex;
                    }
                    if (lastIndex < remainingText.length) {
                        segments.push({ text: remainingText.substring(lastIndex), style: {} });
                    }
                    if (segments.length === 0 && line) {
                        segments.push({ text: line, style: {} });
                    }
                    return segments;
                };
                const applyStyle = (style) => {
                    let fontStyle = '';
                    if (style.italic) fontStyle += 'italic ';
                    if (style.bold) fontStyle += 'bold ';
                    return `${fontStyle} ${fontSize}px ${fontFamily}`;
                };
                const paragraphs = text.split('\n\n');
                const lines = [];
                paragraphs.forEach((paragraph) => {
                    paragraph.split('\n').forEach((rawLine) => {
                        if (rawLine.trim() === '') {
                            lines.push({ segments: [], height: lineHeight * fontSize * 0.5 });
                            return;
                        }
                        const parsedSegments = parseInlineFormatting(rawLine);
                        let currentLineSegments = [];
                        let currentLineWidth = 0;
                        parsedSegments.forEach((segment) => {
                            ctx.font = applyStyle(segment.style);
                            const words = segment.text.split(/(\s+)/).filter(Boolean);
                            words.forEach((word) => {
                                const wordWidth = ctx.measureText(word).width;
                                if (currentLineWidth + wordWidth > maxWidth && currentLineSegments.length > 0 && !/^\s+$/.test(word)) {
                                    lines.push({ segments: [...currentLineSegments], height: lineHeight * fontSize });
                                    const startingWord = /^\s+$/.test(word) ? '' : word.trimStart();
                                    currentLineSegments = [{ text: startingWord, style: segment.style }];
                                    currentLineWidth = startingWord ? ctx.measureText(startingWord).width : 0;
                                } else {
                                    if (currentLineSegments.length === 0 && /^\s+$/.test(word)) return;
                                    currentLineSegments.push({ text: word, style: segment.style });
                                    currentLineWidth += wordWidth;
                                }
                            });
                        });
                        if (currentLineSegments.length > 0) {
                            lines.push({ segments: [...currentLineSegments], height: lineHeight * fontSize });
                        }
                    });
                    lines.push({ segments: [], height: lineHeight * fontSize * 0.7 });
                });
                if (lines.length > 0 && lines[lines.length - 1].segments.length === 0) lines.pop();
                const totalHeight = lines.reduce((sum, line) => sum + line.height, 0) + padding * 2;
                canvas.width = width;
                canvas.height = Math.max(totalHeight, 50);
                ctx.fillStyle = backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textBaseline = 'top';
                let currentY = padding;
                lines.forEach((line) => {
                    let currentX = padding;
                    line.segments.forEach((segment) => {
                        ctx.font = applyStyle(segment.style);
                        ctx.fillStyle = textColor;
                        ctx.fillText(segment.text, currentX, currentY);
                        currentX += ctx.measureText(segment.text).width;
                    });
                    currentY += line.height;
                });
                return canvas.toDataURL('image/png');
            }

                        rhetoricalDevices: 'Biện pháp tu từ',

                    },
                };
                return titles[type]?.[key] || key;
            }

            // === Generate and Insert Image Blocks (unchanged) ===
            async function generateContentImages(result, sections) {
                const imagePromises = [];
                sections.forEach((section) => {
                    const container = document.getElementById(section.id);
                    if (container && section.data) {
                        const textContent = section.formatFunc(section.data);
                        if (textContent) {
                            const promise = textToImage(textContent, 750, {
                                fontSize: 15,
                                lineHeight: 1.7,
                                backgroundColor: section.bgColor,
                                textColor: section.textColor,
                                padding: 25,
                            })
                                .then((imageData) => {
                                    if (imageData) {
                                        container.innerHTML += createImageBlock(imageData, section.title);
                                    } else {
                                        console.warn(`Cannot create image for section: ${section.title}`);
                                        container.innerHTML += `<p class="text-center text-red-500 text-sm my-4">Error creating image for "${section.title}"</p>`;
                                    }
                                })
                                .catch((error) => {
                                    console.error(`Error creating image for ${section.title}:`, error);
                                    container.innerHTML += `<p class="text-center text-red-500 text-sm my-4">Error creating image for "${section.title}"</p>`;
                                });
                            imagePromises.push(promise);
                        }
                    }
                });
                try {
                    await Promise.all(imagePromises);
                    console.log('✅ All analysis images generated and displayed');
                    setupImageBlockHandlers();
                    // setupFbCommentBlocks(); // <-- REMOVED
                } catch (error) {
                    console.error('Error during image generation/display:', error);
                    contentAnalysis.innerHTML += '<p class="text-center text-red-600 font-semibold my-4">Error generating some analysis images.</p>';
                }
            }

            // === Helper to create image + comment block HTML (unchanged) ===
            function createImageBlock(imageData, sectionName) {
                // --- MODIFIED: Removed fb-comment-block div ---
                return ` <div class="content-image-wrapper" data-section="${sectionName}"> <img src="${imageData}" alt="${sectionName} Analysis Image"> </div> `;
            }

            // === Image Block Interaction (unchanged) ===
            let selectedBlock = null;
            function setupImageBlockHandlers() {
                const wrappers = document.querySelectorAll('.content-image-wrapper');
                wrappers.forEach((wrapper) => {
                    const section = wrapper.dataset.section || 'Unknown';
                    wrapper.addEventListener('click', function (e) {
                        // if (e.target.closest('.fb-comment-block')) return; // <-- REMOVED
                        if (selectedBlock && selectedBlock !== this) {
                            selectedBlock.classList.remove('selected');
                        }
                        this.classList.toggle('selected');
                        selectedBlock = this.classList.contains('selected') ? this : null;
                        console.log(selectedBlock ? `📌 Selected Image: "${section}"` : `⚪ Deselected Image: "${section}"`);
                    });
                });
            }

        </script>
    </body>
